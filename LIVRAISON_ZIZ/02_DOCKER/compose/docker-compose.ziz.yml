services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${HDI_DB_NAME:-hydro_hd}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hydro_hd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: hassan-addakhil-backend:1.0.0
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: "5432"
      HDI_DB_NAME: ${HDI_DB_NAME:-hydro_hd}
      DB_NAME: ${HDI_DB_NAME:-hydro_hd}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ENABLE_STARTUP_WARMUPS: ${ENABLE_STARTUP_WARMUPS:-true}
      ENABLE_STATION_MAPPING_INIT: ${ENABLE_STATION_MAPPING_INIT:-true}
      STARTUP_WARMUP_DELAY_MS: ${STARTUP_WARMUP_DELAY_MS:-250}
      STARTUP_WARMUP_TIMEOUT_MS: ${STARTUP_WARMUP_TIMEOUT_MS:-15000}
      SLOW_QUERY_LOG_MS: ${SLOW_QUERY_LOG_MS:-1000}
      HASSAN_DATA_ROOT: ${HASSAN_DATA_ROOT:-}
      SEED_USER_PASSWORD_HASH: ${SEED_USER_PASSWORD_HASH:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/v1/hydro/health').then(async r => { if (!r.ok) process.exit(1); const p = await r.json(); process.exit(p?.database === 'connected' ? 0 : 1); }).catch(() => process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: hassan-addakhil-frontend:1.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_EXPOSE_PORT:-8089}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hydro_hd_pgdata:
