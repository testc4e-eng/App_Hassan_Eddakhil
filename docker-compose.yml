services:
  db:
    image: postgis/postgis:17-3.5
    container_name: hydro-hassan-ilh0107-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_EXPOSE_PORT:-5435}:5432"
    volumes:
      - hydro_hd_pgdata_ilh0107:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ${HYDRO_HD_DUMP_PATH:-./backups/hydro_hd.dump}:/backup/hydro_hd.dump:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

  backend:
    build:
      context: "./hydro_Hassan dakhil/backend"
      dockerfile: Dockerfile
    container_name: hydro-hassan-ilh0107-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8089,http://127.0.0.1:8089}
      SEED_USER_PASSWORD_HASH: ${SEED_USER_PASSWORD_HASH}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_EXPOSE_PORT:-5006}:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/v1/hydro/test/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s

  frontend:
    build:
      context: "./hydro_Hassan dakhil/frontend"
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
        VITE_API_BASE_URL: /api/v1
        VITE_API_URL: /api
    container_name: hydro-hassan-ilh0107-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_EXPOSE_PORT:-8089}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  hydro_hd_pgdata_ilh0107:
